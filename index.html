  /* ── Export / Import ── */
  function exportData() {
    const data = { trades, dailyMoods, sectorMemos, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href     = url;
    a.download = `매매일지_백업_${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
    const st = document.getElementById('backup-status');
    st.style.color = 'var(--green-text)';
    st.textContent = `✓ 백업 완료 (${date})`;
    setTimeout(() => { st.textContent = ''; }, 3000);
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.trades) throw new Error('올바른 백업 파일이 아닙니다.');
        const existing = trades.length;
        if (existing > 0) {
          if (!confirm(`현재 데이터 ${existing}건이 있습니다. 불러온 데이터로 덮어쓸까요?\n\n(취소하면 기존 데이터가 유지됩니다)`)) {
            e.target.value = '';
            return;
          }
        }
        trades      = data.trades      || [];
        dailyMoods  = data.dailyMoods  || [];
        sectorMemos = data.sectorMemos || {};
        save();
        renderAll();
        const st = document.getElementById('backup-status');
        st.style.color = 'var(--green-text)';
        st.textContent = `✓ ${trades.length}건 불러오기 완료`;
        setTimeout(() => { st.textContent = ''; }, 3000);
      } catch(err) {
        const st = document.getElementById('backup-status');
        st.style.color = 'var(--red-text)';
        st.textContent = '⚠ 파일을 읽을 수 없습니다.';
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  /* ── Sector ── */
  function renderSector() {
    const stockMap = {};
    [...trades].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id).forEach(t => {
      if (!stockMap[t.stock]) stockMap[t.stock] = { qty: 0, cost: 0, sector: t.sector || '미분류', everTraded: true };
      if (t.sector) stockMap[t.stock].sector = t.sector;
      const s = stockMap[t.stock];
      if (t.type === 'buy') { s.qty += t.qty; s.cost += t.qty * t.price; }
      else { const avg = s.qty > 0 ? s.cost / s.qty : 0; s.qty = Math.max(0, s.qty - t.qty); s.cost = s.qty * avg; }
    });

    // 섹터별 집계 — 보유 중인 것만 금액 합산, 거래한 적 있는 섹터는 모두 포함
    const sectorMap = {};
    Object.entries(stockMap).forEach(([stock, info]) => {
      const sec = info.sector || '미분류';
      if (!sectorMap[sec]) sectorMap[sec] = { stocks: [], totalAmt: 0 };
      const amt = info.cost; // 보유 없으면 0
      sectorMap[sec].stocks.push({ stock, qty: info.qty, amt, avg: info.qty > 0 ? Math.round(info.cost / info.qty) : 0, holding: info.qty > 0 });
      sectorMap[sec].totalAmt += amt;
    });

    // 섹터 메모만 있는 섹터도 포함
    Object.keys(sectorMemos).forEach(sec => {
      if (sec && !sectorMap[sec]) sectorMap[sec] = { stocks: [], totalAmt: 0 };
    });

    const sectors = Object.keys(sectorMap).sort((a, b) => sectorMap[b].totalAmt - sectorMap[a].totalAmt);
    const totalAmt = sectors.reduce((s, sec) => s + sectorMap[sec].totalAmt, 0);
    const holdingStocks = Object.values(stockMap).filter(s => s.qty > 0).length;

    if (sectors.length === 0) {
      document.getElementById('sector-content').innerHTML = `<div class="empty-state"><div class="e-icon">🏷️</div><p>보유 중인 종목이 없거나 섹터가 입력되지 않았어요.<br>매매 입력 시 섹터를 함께 입력해주세요.</p></div>`;
      return;
    }

    // 요약
    const summaryHtml = `<div class="sector-summary">
      <div class="sector-summary-cell"><div class="ss-label">섹터 수</div><div class="ss-val">${sectors.length}개</div></div>
      <div class="sector-summary-cell"><div class="ss-label">보유 종목</div><div class="ss-val">${holdingStocks}개</div></div>
      <div class="sector-summary-cell"><div class="ss-label">총 매입금액</div><div class="ss-val">${fmtAmt(totalAmt)}</div></div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button onclick="addSectorMemo()" style="font-size:12px;padding:6px 14px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;">+ 섹터 추가</button>
    </div>`;

    // 섹터 카드
    let cardsHtml = '<div class="sector-grid">';
    sectors.forEach((sec, i) => {
      const color  = SECTOR_COLORS[i % SECTOR_COLORS.length];
      const info   = sectorMap[sec];
      const pct    = totalAmt > 0 ? ((info.totalAmt / totalAmt) * 100).toFixed(1) : 0;
      const memo   = sectorMemos[sec] || '';
      const secId  = 'sec-' + sec.replace(/\s/g, '_').replace(/[()]/g, '');
      const isHolding = info.stocks.some(s => s.holding);

      const stockRows = info.stocks.length > 0
        ? info.stocks.sort((a, b) => b.amt - a.amt).map(s =>
          `<div class="sector-stock-row">
            <span class="sector-stock-name">${s.stock}</span>
            <div class="sector-stock-right">
              ${s.holding
                ? `<span class="sector-stock-qty">${fmt(s.qty)}주</span>
                   <span class="sector-stock-amt">${fmtAmt(s.amt)}</span>
                   <span style="font-size:10px;color:var(--green);background:var(--green-bg);border:1px solid var(--green);border-radius:3px;padding:1px 6px;">보유중</span>`
                : `<span style="font-size:11px;color:var(--text3);">전량매도</span>`
              }
            </div>
          </div>`
        ).join('')
        : `<div style="padding:10px 16px;font-size:12px;color:var(--text3);">거래 기록 없음</div>`;

      cardsHtml += `<div class="sector-card">
        <div class="sector-card-header">
          <div class="sector-card-title-row">
            <div class="sector-card-name"><span class="sector-dot" style="background:${color}"></span>${sec}</div>
            <span class="sector-card-pct" style="color:${isHolding ? color : 'var(--text3)'};">${pct}%</span>
          </div>
          <div class="sector-bar-wrap">
            <div class="sector-bar-bg"><div class="sector-bar-fill" style="width:${pct}%;background:${color}"></div></div>
          </div>
        </div>
        <div class="sector-card-memo" id="${secId}-memo-wrap" onclick="editSecMemo('${sec}')">
          <div class="sector-memo-text" id="${secId}-view">${memo ? memo.replace(/\n/g,'<br>') : ''}</div>
          <textarea class="sector-memo-edit-area" id="${secId}-input" onclick="event.stopPropagation()">${memo}</textarea>
          <button class="sector-memo-save" id="${secId}-save" onclick="event.stopPropagation();saveSecMemo('${sec}')">저장</button>
        </div>
        <div class="sector-stock-list">${stockRows}</div>
        <div class="sector-card-total">
          <span>${info.stocks.length}개 종목</span>
          <span>${isHolding ? fmtAmt(info.totalAmt) : '—'}</span>
        </div>
      </div>`;
    });
    cardsHtml += '</div>';

    // 차트 (보유 중인 섹터만)
    const holdingSectors = sectors.filter(sec => sectorMap[sec].totalAmt > 0);
    let chartHtml = '';
    if (holdingSectors.length > 0) {
      const maxAmt = sectorMap[holdingSectors[0]].totalAmt;
      const chartRows = holdingSectors.map((sec, i) => {
        const color = SECTOR_COLORS[sectors.indexOf(sec) % SECTOR_COLORS.length];
        const info  = sectorMap[sec];
        const pct   = totalAmt > 0 ? ((info.totalAmt / totalAmt) * 100).toFixed(1) : 0;
        const barW  = maxAmt > 0 ? ((info.totalAmt / maxAmt) * 100).toFixed(1) : 0;
        const showInside = barW > 30;
        return `<div class="chart-bar-row">
          <span class="chart-bar-label">${sec}</span>
          <div class="chart-bar-track">
            <div class="chart-bar-fill" style="width:${barW}%;background:${color}">
              ${showInside ? `<span class="chart-bar-val">${fmtAmt(info.totalAmt)} (${pct}%)</span>` : ''}
            </div>
            ${!showInside ? `<span class="chart-bar-val outside">${fmtAmt(info.totalAmt)} (${pct}%)</span>` : ''}
          </div>
        </div>`;
      }).join('');
      chartHtml = `<div class="chart-section">
        <div class="chart-title">섹터별 매입금액 비중 (보유 중)</div>
        <div class="chart-bars">${chartRows}</div>
      </div>`;
    }

    document.getElementById('sector-content').innerHTML = summaryHtml + cardsHtml + chartHtml;
  }

  function editSecMemo(sec) {
    const secId = 'sec-' + sec.replace(/\s/g, '_').replace(/[()]/g, '');
    const view  = document.getElementById(secId + '-view');
    const input = document.getElementById(secId + '-input');
    const btn   = document.getElementById(secId + '-save');
    if (input.style.display === 'block') return;
    view.style.display  = 'none';
    input.style.display = 'block';
    btn.style.display   = 'inline-block';
    input.focus();
  }

  function saveSecMemo(sec) {
    const secId = 'sec-' + sec.replace(/\s/g, '_').replace(/[()]/g, '');
    const input = document.getElementById(secId + '-input');
    const view  = document.getElementById(secId + '-view');
    const btn   = document.getElementById(secId + '-save');
    const val   = input.value;
    sectorMemos[sec] = val;
    save();
    view.innerHTML      = val ? val.replace(/\n/g,'<br>') : '';
    view.style.display  = 'block';
    input.style.display = 'none';
    btn.style.display   = 'none';
  }

  function addSectorMemo() {
    const name = prompt('추가할 섹터 이름을 입력하세요:');
    if (!name || !name.trim()) return;
    if (!sectorMemos[name.trim()]) sectorMemos[name.trim()] = '';
    save();
    renderSector();
  }

  function editSectorMemo() {}
  function saveSectorMemo() {}
  function renderMonthly() {
    if (trades.length === 0) {
      document.getElementById('monthly-list').innerHTML = `<div class="empty-state"><div class="e-icon">📅</div><p>아직 기록이 없습니다.</p></div>`;
      return;
    }

    // 종목별 평균단가 추적 (실현손익 계산용)
    const stockAvg = {}; // { stock: { qty, cost } }

    // 시간순 정렬 후 처리
    const sorted = [...trades].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);

    // 각 매도 거래에 실현손익 계산
    const tradeWithProfit = sorted.map(t => {
      if (!stockAvg[t.stock]) stockAvg[t.stock] = { qty: 0, cost: 0 };
      const s = stockAvg[t.stock];
      let profit = null;
      if (t.type === 'buy') {
        s.qty += t.qty;
        s.cost += t.qty * t.price;
      } else {
        const avg = s.qty > 0 ? s.cost / s.qty : t.price;
        profit = Math.round((t.price - avg) * t.qty);
        s.qty = Math.max(0, s.qty - t.qty);
        s.cost = s.qty * avg;
      }
      return { ...t, profit };
    });

    // 월별 그룹핑
    const byMonth = {};
    tradeWithProfit.forEach(t => {
      const key = t.date.slice(0, 7); // YYYY-MM
      if (!byMonth[key]) byMonth[key] = [];
      byMonth[key].push(t);
    });

    const months = Object.keys(byMonth).sort((a, b) => b.localeCompare(a));
    let html = '';

    months.forEach(month => {
      const ts = byMonth[month];
      const buys  = ts.filter(t => t.type === 'buy');
      const sells = ts.filter(t => t.type === 'sell');
      const buyAmt  = buys.reduce((s, t) => s + t.qty * t.price, 0);
      const sellAmt = sells.reduce((s, t) => s + t.qty * t.price, 0);
      const realized = sells.reduce((s, t) => s + (t.profit || 0), 0);
      const profitClass = realized > 0 ? 'pos' : realized < 0 ? 'neg' : '';
      const profitSign  = realized > 0 ? '+' : '';
      const [y, m] = month.split('-');
      const monthLabel = `${y}년 ${parseInt(m)}월`;

      const rowsHtml = ts.map(t => {
        const badgeClass = t.type === 'buy' ? 'badge-buy' : t.type === 'sell' ? 'badge-sell' : 'badge-watch';
        const badgeText  = t.type === 'buy' ? 'BUY' : t.type === 'sell' ? 'SELL' : '관망';
        const profitTd = t.type === 'sell' && t.profit !== null
          ? `<td class="mtr-profit ${t.profit >= 0 ? 'pos' : 'neg'}">${t.profit >= 0 ? '+' : ''}${fmt(t.profit)}원</td>`
          : `<td style="color:var(--text3);text-align:right;font-family:'JetBrains Mono',monospace;">—</td>`;
        return `<tr>
          <td class="mtr-date">${t.date.slice(5).replace('-','/')}</td>
          <td><span class="trade-type-badge ${badgeClass}" style="font-size:10px;padding:2px 8px;">${badgeText}</span></td>
          <td>${t.sector ? `<span class="sector-chip">${t.sector}</span>` : '<span style="color:var(--text3);">—</span>'}</td>
          <td class="mtr-stock">${t.stock || '—'}</td>
          <td style="font-size:10px;color:#6e8cc8;">${t.tradeStyle || '<span style="color:var(--text3);">—</span>'}</td>
          <td style="font-size:10px;color:var(--red-text);">${t.stoploss ? t.stoploss + '%' : '<span style="color:var(--text3);">미설정</span>'}</td>
          <td class="mtr-detail">${t.qty ? fmt(t.qty) + '주' : '—'}</td>
          <td class="mtr-detail">${t.price ? fmt(t.price) + '원' : '—'}</td>
          <td class="mtr-amt">${t.qty && t.price ? fmt(t.qty * t.price) + '원' : '—'}</td>
          ${profitTd}
        </tr>`;
      }).join('');

      html += `<div class="month-group">
        <div class="month-heading">
          <div class="month-heading-left">
            <span>${monthLabel}</span>
            <span style="font-size:11px;color:var(--text3);font-weight:400;">${ts.length}건</span>
          </div>
          <button class="month-toggle" onclick="toggleMonth('${month}')">접기 ▲</button>
        </div>
        <div class="month-stats">
          <div class="month-stat"><div class="ms-label">매수</div><div class="ms-val">${buys.length}건 · ${fmt(buyAmt)}원</div></div>
          <div class="month-stat"><div class="ms-label">매도</div><div class="ms-val">${sells.length}건 · ${fmt(sellAmt)}원</div></div>
          <div class="month-stat"><div class="ms-label">실현손익</div><div class="ms-val ${profitClass}">${profitSign}${fmt(realized)}원</div></div>
          <div class="month-stat"><div class="ms-label">종목 수</div><div class="ms-val">${[...new Set(ts.map(t => t.stock))].length}개</div></div>
        </div>
        <div class="month-trades" id="month-rows-${month}">
          <table class="month-table">
            <colgroup>
              <col class="col-date"><col class="col-type"><col class="col-stock"><col class="col-sector">
              <col class="col-qty"><col class="col-price"><col class="col-amt"><col class="col-profit">
            </colgroup>
            <thead><tr>
              <th>날짜</th><th>구분</th><th>섹터</th><th>종목</th><th>유형</th><th>손절선</th><th>수량</th><th>단가</th><th class="right">금액</th><th class="right">실현손익</th>
            </tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>`;
    });

    document.getElementById('monthly-list').innerHTML = html;
  }

  function toggleMonth(month) {
    const el  = document.getElementById('month-rows-' + month);
    const btn = el.previousElementSibling.previousElementSibling.querySelector('.month-toggle');
    if (el.style.display === 'none') {
      el.style.display = 'block';
      btn.textContent = '접기 ▲';
    } else {
      el.style.display = 'none';
      btn.textContent = '펼치기 ▼';
    }
  }

  function renderStats() {
    const total  = trades.length;
    const buys   = trades.filter(t => t.type === 'buy');
    const sells  = trades.filter(t => t.type === 'sell');
    const holdingStocks = [...new Set(
      trades.filter(t => {
        const s  = trades.filter(x => x.stock === t.stock);
        const bq = s.filter(x => x.type === 'buy').reduce((a, x) => a + x.qty, 0);
        const sq = s.filter(x => x.type === 'sell').reduce((a, x) => a + x.qty, 0);
        return bq - sq > 0;
      }).map(t => t.stock)
    )].length;
    const totalAmt = buys.reduce((s, t) => s + t.qty * t.price, 0);
    document.getElementById('stat-total').textContent    = total + '회';
    document.getElementById('stat-buysell').textContent  = buys.length + ' / ' + sells.length;
    document.getElementById('stat-stocks').textContent   = holdingStocks + '개';
    document.getElementById('stat-amount').textContent   = fmtAmt(totalAmt);
  }

  function getPositionAt(stock, beforeId) {
    const relevant = trades
      .filter(t => t.stock === stock && t.id <= beforeId)
      .sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
    let qty = 0, cost = 0;
    relevant.forEach(t => {
      if (t.type === 'buy') { qty += t.qty; cost += t.qty * t.price; }
      else { const avg = qty > 0 ? cost / qty : 0; qty = Math.max(0, qty - t.qty); cost = qty * avg; }
    });
    return { qty, avg: qty > 0 ? Math.round(cost / qty) : 0 };
  }

  function renderDaily() {
    const allEmpty = trades.length === 0 && dailyMoods.length === 0;
    if (allEmpty) {
      document.getElementById('daily-list').innerHTML = `<div class="empty-state"><div class="e-icon">📋</div><p>아직 기록이 없습니다.<br>왼쪽 폼에서 매매를 입력해보세요.</p></div>`;
      return;
    }
    const byDate = {};
    [...trades].sort((a, b) => b.date.localeCompare(a.date)).forEach(t => {
      if (!byDate[t.date]) byDate[t.date] = { trades: [], moods: [] };
      byDate[t.date].trades.push(t);
    });
    dailyMoods.forEach(m => {
      if (!byDate[m.date]) byDate[m.date] = { trades: [], moods: [] };
      byDate[m.date].moods.push(m);
    });
    const days = ['일','월','화','수','목','금','토'];
    let html = '';
    const sortedDates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
    for (const date of sortedDates) {
      const { trades: ts, moods: ms } = byDate[date];
      const d      = new Date(date + 'T00:00:00');
      const dlabel = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${days[d.getDay()]}`;
      html += `<div class="day-group"><div class="day-heading"><span>${dlabel}</span><span class="day-count">${ts.length}건</span></div>`;

      // 오늘의 심리 카드
      ms.forEach(m => {
        const moodInfo = MOOD_MAP[m.mood] || MOOD_MAP.neutral;
        html += `<div class="trade-card" style="border-color:#d0d8f0;">
          <div class="trade-card-row1" style="grid-template-columns:1fr;">
            <div class="trade-card-left" style="background:#f8f9ff;">
              <div class="trade-card-top">
                <span class="trade-type-badge badge-watch">오늘의 심리</span>
                <span style="font-size:16px;">${moodInfo.emoji}</span>
                <span style="font-size:13px;font-weight:500;color:var(--text);">${moodInfo.label}</span>
                ${m.summary ? `<span style="font-size:12px;color:var(--text2);flex:1;">${m.summary}</span>` : ''}
                <button class="delete-btn" onclick="deleteDailyMood(${m.id})" title="삭제">×</button>
              </div>
              ${m.note ? `<div class="trade-card-meta"><div class="meta-item"><div class="meta-text" style="color:var(--text2);">${m.note}</div></div></div>` : ''}
            </div>
          </div>
        </div>`;
      });
      ts.forEach(t => {
        const mood     = MOOD_MAP[t.mood] || MOOD_MAP.neutral;
        const hasBottom = t.reason || t.mood;
        const pos      = getPositionAt(t.stock, t.id);
        const posHtml = pos.qty > 0
          ? `<div class="pos-label">매입평균가</div>
             <div class="pos-value">${fmt(pos.avg)}원</div>
             <div class="pos-sub">보유 ${fmt(pos.qty)}주</div>
             <div class="pos-sub">평가 ${fmt(pos.qty * pos.avg)}원</div>`
          : `<div class="pos-value sold">전량 매도</div>`;
        const moodHtml = t.mood
          ? `<div class="meta-item">
               <div class="meta-label">매매심리</div>
               <div class="meta-text"><span class="emoji">${mood.emoji}</span>${mood.label}${t.moodNote ? ' · ' + t.moodNote : ''}</div>
             </div>` : '';
        const reasonHtml = t.reason
          ? `<div class="meta-item">
               <div class="meta-label">매매근거</div>
               <div class="meta-text">${t.reason}</div>
             </div>` : '';
        const badgeClass = t.type === 'buy' ? 'badge-buy' : t.type === 'sell' ? 'badge-sell' : 'badge-watch';
        const badgeText  = t.type === 'buy' ? 'BUY' : t.type === 'sell' ? 'SELL' : '관망';

        if (t.type === 'watch') {
          html += `<div class="trade-card">
            <div class="trade-card-row1" style="grid-template-columns:1fr;">
              <div class="trade-card-left">
                <div class="trade-card-top">
                  <span class="trade-type-badge badge-watch">관망</span>
                  <span class="trade-stock-name" style="color:var(--text2);font-size:13px;">${t.date}</span>
                  <button class="edit-btn" onclick="openEditModal(${t.id})" title="수정">✎</button>
                  <button class="delete-btn" onclick="deleteTrade(${t.id})" title="삭제">×</button>
                </div>
                ${(moodHtml || reasonHtml) ? `<div class="trade-card-meta">${moodHtml}${reasonHtml}</div>` : ''}
              </div>
            </div>
          </div>`;
        } else {
          html += `<div class="trade-card">
            <div class="trade-card-row1">
              <div class="trade-card-left">
                <div class="trade-card-top">
                  <span class="trade-type-badge ${badgeClass}">${badgeText}</span>
                  <span class="trade-stock-name">${t.stock}</span>
                  ${t.sector ? `<span class="sector-chip">${t.sector}</span>` : ''}
                  ${t.tradeStyle ? `<span style="font-size:10px;color:#6e8cc8;background:#f0f4ff;border:1px solid #6e8cc8;border-radius:3px;padding:2px 7px;white-space:nowrap;">${t.tradeStyle}</span>` : ''}
                  ${t.stoploss ? `<span style="font-size:10px;color:var(--red-text);background:var(--red-bg);border:1px solid var(--red);border-radius:3px;padding:2px 7px;white-space:nowrap;">✂ ${t.stoploss}%</span>` : '<span style="font-size:10px;color:var(--text3);background:var(--bg4);border:1px solid var(--border2);border-radius:3px;padding:2px 7px;white-space:nowrap;">손절선 미설정</span>'}
                  <span class="trade-numbers"><span>${fmt(t.qty)}주</span> @ <span>${fmt(t.price)}원</span></span>
                  <span class="trade-total">${fmt(t.qty * t.price)}원</span>
                  <button class="edit-btn" onclick="openEditModal(${t.id})" title="수정">✎</button>
                  <button class="delete-btn" onclick="deleteTrade(${t.id})" title="삭제">×</button>
                </div>
                ${(moodHtml || reasonHtml) ? `<div class="trade-card-meta">${moodHtml}${reasonHtml}</div>` : ''}
              </div>
              <div class="trade-card-pos">${posHtml}</div>
            </div>
          </div>`;
        }
      });
      html += '</div>';
    }
    document.getElementById('daily-list').innerHTML = html;
  }

  function renderStock() {
    const stockNames = [...new Set(trades.filter(t => t.type !== 'watch').map(t => t.stock))].filter(Boolean);
    if (stockNames.length === 0) {
      document.getElementById('stock-list').innerHTML = `<div class="empty-state"><div class="e-icon">📦</div><p>종목 데이터가 없습니다.</p></div>`;
      return;
    }

    // 종목별 데이터 계산
    const stockData = {};
    stockNames.forEach(stock => {
      const sts = trades.filter(t => t.stock === stock).sort((a, b) => a.date.localeCompare(b.date));
      const sector = sts.slice().reverse().find(t => t.sector)?.sector || '미분류';
      let cumQty = 0, totalCost = 0;
      const rows = sts.map((t, i) => {
        if (t.type === 'buy') { cumQty += t.qty; totalCost += t.qty * t.price; }
        else { const avg = cumQty > 0 ? totalCost / cumQty : 0; cumQty = Math.max(0, cumQty - t.qty); totalCost = cumQty * avg; }
        const avgP = cumQty > 0 ? Math.round(totalCost / cumQty) : 0;
        const mood = MOOD_MAP[t.mood] || MOOD_MAP.neutral;
        return `<tr>
          <td>${i + 1}</td>
          <td>${t.date.slice(5).replace('-', '/')}</td>
          <td><span class="trade-type-badge ${t.type === 'buy' ? 'badge-buy' : 'badge-sell'}">${t.type === 'buy' ? 'BUY' : 'SELL'}</span></td>
          <td>${fmt(t.qty)}</td>
          <td>${fmt(t.price)}</td>
          <td class="cum-qty-col">${cumQty}</td>
          <td class="avg-price-col">${avgP > 0 ? fmt(avgP) : '—'}</td>
          <td class="mood-cell" title="${mood.label}${t.moodNote ? ': ' + t.moodNote : ''}">${mood.emoji}</td>
          <td class="reason-col">${t.reason || '—'}</td>
        </tr>`;
      });
      const finalQty = sts.reduce((acc, t) => t.type === 'buy' ? acc + t.qty : Math.max(0, acc - t.qty), 0);
      const buyOnly  = sts.filter(t => t.type === 'buy');
      const totalBQ  = buyOnly.reduce((s, t) => s + t.qty, 0);
      const totalBC  = buyOnly.reduce((s, t) => s + t.qty * t.price, 0);
      const overallAvg = totalBQ > 0 ? Math.round(totalBC / totalBQ) : 0;
      stockData[stock] = { sts, sector, rows, finalQty, overallAvg };
    });

    // 섹터별 그룹핑
    const sectorGroups = {};
    Object.entries(stockData).forEach(([stock, d]) => {
      if (!sectorGroups[d.sector]) sectorGroups[d.sector] = [];
      sectorGroups[d.sector].push(stock);
    });

    // 섹터 정렬: 보유 종목 있는 섹터 먼저
    const sortedSectors = Object.keys(sectorGroups).sort((a, b) => {
      const aHolding = sectorGroups[a].some(s => stockData[s].finalQty > 0);
      const bHolding = sectorGroups[b].some(s => stockData[s].finalQty > 0);
      if (aHolding !== bHolding) return bHolding ? 1 : -1;
      return a.localeCompare(b);
    });

    let html = '';
    sortedSectors.forEach((sector, si) => {
      const color = SECTOR_COLORS[si % SECTOR_COLORS.length];
      const stocks = sectorGroups[sector];
      const holdingCount = stocks.filter(s => stockData[s].finalQty > 0).length;

      html += `<div style="margin-bottom:24px;">
        <div style="display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid ${color};margin-bottom:10px;">
          <span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;"></span>
          <span style="font-size:13px;font-weight:600;color:var(--text);">${sector}</span>
          <span style="font-size:11px;color:var(--text3);">${stocks.length}개 종목 · 보유 ${holdingCount}개</span>
        </div>`;

      stocks.forEach(stock => {
        const d = stockData[stock];
        const cardId = 'stock-' + stock.replace(/\s/g, '_');
        html += `<div class="stock-card" style="margin-bottom:8px;">
          <div class="stock-card-header" onclick="toggleStockCard('${cardId}')" style="cursor:pointer;">
            <div class="stock-title-group">
              <span class="stock-title">${stock}</span>
              ${d.finalQty > 0 ? `<span style="font-size:10px;color:var(--green);background:var(--green-bg);border:1px solid var(--green);border-radius:3px;padding:2px 7px;">보유중</span>` : `<span style="font-size:10px;color:var(--text3);background:var(--bg4);border:1px solid var(--border2);border-radius:3px;padding:2px 7px;">전량매도</span>`}
            </div>
            <div style="display:flex;align-items:center;gap:14px;">
              <div class="stock-pills">
                <span class="stock-pill holding">보유 <strong>${fmt(d.finalQty)}주</strong></span>
                <span class="stock-pill">평균단가 <strong>${d.finalQty > 0 ? fmt(d.overallAvg) + '원' : '—'}</strong></span>
                <span class="stock-pill">거래 <strong>${d.sts.length}회</strong></span>
              </div>
              <span id="${cardId}-icon" style="font-size:11px;color:var(--text3);">▼</span>
            </div>
          </div>
          <div id="${cardId}-body" style="display:none;">
            <div class="stock-table-wrap">
              <table class="stock-table">
                <thead><tr><th>#</th><th>날짜</th><th>구분</th><th>수량</th><th>단가</th><th>누적</th><th>평균단가</th><th>심리</th><th>근거</th></tr></thead>
                <tbody>${d.rows.join('')}</tbody>
              </table>
            </div>
          </div>
        </div>`;
      });

      html += '</div>';
    });

    document.getElementById('stock-list').innerHTML = html;
  }

  function toggleStockCard(cardId) {
    const body = document.getElementById(cardId + '-body');
    const icon = document.getElementById(cardId + '-icon');
    const open = body.style.display === 'none';
    body.style.display = open ? 'block' : 'none';
    icon.textContent = open ? '▲' : '▼';
  }

  window.addEventListener('load', function() {
    document.getElementById('edit-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  });

</script>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">기록 수정</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-type-toggle">
      <button class="type-btn buy" id="modal-btn-buy" onclick="setModalType('buy')">▲ 매수</button>
      <button class="type-btn sell" id="modal-btn-sell" onclick="setModalType('sell')">▼ 매도</button>
    </div>
    <div style="height:12px"></div>
    <div class="modal-field">
      <label>날짜</label>
      <input type="date" id="m-date" />
    </div>
    <div class="modal-field-row">
      <div class="modal-field">
        <label>종목명</label>
        <input type="text" id="m-stock" />
      </div>
      <div class="modal-field">
        <label>섹터</label>
        <input type="text" id="m-sector" list="sector-list" />
      </div>
    </div>
    <div class="modal-field-row">
      <div class="modal-field">
        <label>수량 (주)</label>
        <input type="number" id="m-qty" min="1" />
      </div>
      <div class="modal-field">
        <label>단가 (원)</label>
        <input type="number" id="m-price" min="0" />
      </div>
    </div>
    <div class="modal-field">
      <label>매매 근거</label>
      <textarea id="m-reason"></textarea>
    </div>
    <div class="modal-field">
      <label>매매 심리</label>
      <div class="modal-mood-grid">
        <button class="modal-mood-btn" data-mood="fear" onclick="setModalMood('fear')">😨<span class="mood-label">공포</span></button>
        <button class="modal-mood-btn" data-mood="anxiety" onclick="setModalMood('anxiety')">😟<span class="mood-label">불안</span></button>
        <button class="modal-mood-btn" data-mood="neutral" onclick="setModalMood('neutral')">😐<span class="mood-label">중립</span></button>
        <button class="modal-mood-btn" data-mood="confident" onclick="setModalMood('confident')">🤭<span class="mood-label">확신</span></button>
        <button class="modal-mood-btn" data-mood="greed" onclick="setModalMood('greed')">🤑<span class="mood-label">과욕</span></button>
      </div>
      <input type="text" id="m-mood-note" placeholder="심리 상태를 직접 적어보세요" style="margin-top:7px;" />
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">취소</button>
      <button class="modal-save" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

</body>
</html>
