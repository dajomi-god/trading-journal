<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 매매일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --bg2: #ffffff;
    --bg3: #f0efe9;
    --bg4: #e8e7e0;
    --border: #e0dfd8;
    --border2: #d0cfc8;
    --text: #1a1916;
    --text2: #5a5856;
    --text3: #9a9890;
    --accent: #8a6a2e;
    --accent2: #a08040;
    --green: #2e7a50;
    --green-bg: #eaf5ee;
    --green-text: #1e5c38;
    --red: #c0504a;
    --red-bg: #fdf0ef;
    --red-text: #9a2e28;
    --radius: 6px;
    --radius-lg: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }
  .layout { display: grid; grid-template-columns: 310px 1fr; min-height: 100vh; }

  /* Sidebar */
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .sidebar-header { padding: 22px 20px 14px; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
  .logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .logo h1 { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
  .logo-sub { font-size: 11px; color: var(--text3); margin-left: 38px; font-family: 'JetBrains Mono', monospace; }
  .form-section { padding: 18px 20px; flex: 1; }
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; margin-top: 4px; }

  /* Type toggle */
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .type-btn { padding: 8px; border: 1px solid var(--border2); border-radius: var(--radius); background: transparent; color: var(--text2); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; letter-spacing: -0.01em; }
  .type-btn:hover { border-color: var(--text3); color: var(--text); }
  .type-btn.buy.active { background: var(--green-bg); border-color: var(--green); color: var(--green-text); }
  .type-btn.sell.active { background: var(--red-bg); border-color: var(--red); color: var(--red-text); }

  /* Fields */
  .type-btn.watch.active { background: #f0f4ff; border-color: #6e8cc8; color: #3a5a9e; }
  .field label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.02em; }
  .field input, .field textarea, .field select { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; padding: 7px 10px; outline: none; transition: border-color 0.15s; -webkit-appearance: none; }
  .field input[type="number"] { font-family: 'JetBrains Mono', monospace; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent2); }
  .field textarea { resize: none; height: 58px; line-height: 1.5; }
  .field select option { background: var(--bg3); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* Mood selector */
  .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .mood-btn { padding: 6px 2px; border: 1px solid var(--border2); border-radius: var(--radius); background: transparent; cursor: pointer; font-size: 18px; text-align: center; transition: all 0.15s; position: relative; }
  .mood-btn:hover { border-color: var(--text3); transform: scale(1.08); }
  .mood-btn.active { border-color: var(--accent); background: rgba(200,169,110,0.12); }
  .mood-btn .mood-label { display: block; font-size: 9px; color: var(--text3); margin-top: 2px; font-family: 'Noto Sans KR', sans-serif; }
  .mood-btn.active .mood-label { color: var(--accent); }

  /* Submit */
  .submit-btn { width: 100%; padding: 10px; background: var(--accent); border: none; border-radius: var(--radius); color: #ffffff; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 6px; letter-spacing: -0.01em; }
  .submit-btn:hover { background: var(--accent2); }
  .submit-btn:active { transform: scale(0.98); }

  /* AI feedback */
  .ai-feedback { margin-top: 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px; display: none; }
  .ai-feedback.visible { display: block; }
  .ai-feedback-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .ai-feedback-text { font-size: 12px; color: var(--text2); line-height: 1.75; }
  .spinner { width: 10px; height: 10px; border: 1.5px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* API prompt */
  .api-prompt { background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 16px; }
  .api-prompt-title { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  .api-prompt p { font-size: 11px; color: var(--text3); margin-bottom: 8px; line-height: 1.6; }
  .api-key-row { display: flex; gap: 6px; }
  .api-key-row input { flex: 1; background: var(--bg4); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 8px; outline: none; }
  .api-key-row button { padding: 6px 12px; background: var(--accent); border: none; border-radius: var(--radius); color: #ffffff; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: 'Noto Sans KR', sans-serif; }
  .api-status { font-size: 11px; margin-top: 5px; color: var(--text3); }
  .api-status.ok { color: var(--green-text); }

  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .tabs-bar { display: flex; align-items: center; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; }
  .tab { padding: 13px 18px; font-size: 13px; font-weight: 500; color: var(--text3); border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; margin-bottom: -1px; }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Stats bar */
  .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
  .stat-cell { background: var(--bg2); padding: 11px 20px; }
  .stat-cell .s-label { font-size: 10px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
  .stat-cell .s-val { font-size: 17px; font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; }

  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Daily */
  .day-group { margin-bottom: 26px; }
  .day-heading { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; font-family: 'JetBrains Mono', monospace; padding-bottom: 9px; border-bottom: 1px solid var(--border); margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; }
  .day-count { background: var(--bg4); border: 1px solid var(--border2); border-radius: 20px; padding: 2px 10px; font-size: 10px; color: var(--text3); }

  .trade-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0; margin-bottom: 6px; transition: border-color 0.15s; overflow: hidden; }
  .trade-card:hover { border-color: var(--border2); }
  .trade-card-row1 { display: grid; grid-template-columns: 3fr 1fr; min-height: 52px; }
  .trade-card-left { padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 6px; border-right: 1px solid var(--border); }
  .trade-card-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .trade-card-meta { display: flex; gap: 16px; }
  .trade-card-pos { padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; background: var(--bg3); }
  .pos-label { font-size: 10px; color: var(--text3); letter-spacing: 0.04em; }
  .pos-value { font-size: 13px; font-weight: 600; color: var(--accent); font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; }
  .pos-value.sold { color: var(--text3); font-size: 11px; }
  .pos-sub { font-size: 10px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
  .meta-item { display: flex; flex-direction: column; gap: 1px; }
  .meta-label { font-size: 10px; color: var(--text3); letter-spacing: 0.04em; }
  .meta-text { font-size: 12px; color: var(--text2); line-height: 1.4; word-break: keep-all; }
  .meta-text .emoji { font-size: 13px; margin-right: 3px; }

  .trade-type-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 4px; white-space: nowrap; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.02em; }
  .badge-buy { background: var(--green-bg); color: var(--green-text); border: 1px solid var(--green); }
  .badge-sell { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red); }
  .badge-watch { background: #f0f4ff; color: #3a5a9e; border: 1px solid #6e8cc8; }

  .trade-stock-name { font-size: 14px; font-weight: 600; color: var(--text); min-width: 90px; letter-spacing: -0.02em; }
  .sector-chip { font-size: 10px; color: var(--text3); background: var(--bg4); border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px; white-space: nowrap; }
  .trade-numbers { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text2); flex: 1; }
  .trade-numbers span { color: var(--text); font-weight: 500; }
  .trade-total { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; color: var(--accent); white-space: nowrap; }

  .mood-chip { font-size: 13px; display: flex; align-items: center; gap: 5px; }
  .mood-chip .mood-text { font-size: 12px; color: var(--text2); }
  .reason-block { font-size: 13px; color: var(--text2); line-height: 1.5; word-break: keep-all; }

  .delete-btn { background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; transition: all 0.15s; opacity: 0; margin-left: auto; }
  .trade-card:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { color: var(--red-text); background: var(--red-bg); }

  /* Stock panel */
  .stock-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 16px; overflow: hidden; }
  .stock-card-header { padding: 13px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .stock-title-group { display: flex; align-items: center; gap: 8px; }
  .stock-title { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
  .sector-badge { font-size: 10px; color: var(--text3); background: var(--bg4); border: 1px solid var(--border2); border-radius: 4px; padding: 2px 8px; letter-spacing: 0.02em; }
  .stock-pills { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .stock-pill { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
  .stock-pill strong { color: var(--text); font-weight: 500; }
  .stock-pill.holding strong { color: var(--accent); }
  .stock-table-wrap { overflow-x: auto; }
  .stock-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .stock-table th { text-align: left; padding: 7px 14px; color: var(--text3); font-weight: 500; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--bg3); border-bottom: 1px solid var(--border); }
  .stock-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); color: var(--text2); font-family: 'JetBrains Mono', monospace; vertical-align: middle; }
  .stock-table tr:last-child td { border-bottom: none; }
  .stock-table tr:hover td { background: var(--bg3); }
  .stock-table td.name-col { font-family: 'Noto Sans KR', sans-serif; color: var(--text); font-weight: 500; font-size: 13px; }
  .stock-table td.reason-col { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; color: var(--text3); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avg-price-col { color: var(--accent) !important; }
  .cum-qty-col { color: var(--text) !important; }

  /* Mood col in table */
  .mood-cell { font-size: 14px; text-align: center; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-state .e-icon { font-size: 32px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; line-height: 1.7; }

  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  /* Sector panel */
  /* Sector panel */
  .sector-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px; }
  .sector-summary-cell { background: var(--bg2); padding: 12px 16px; }
  .sector-summary-cell .ss-label { font-size: 10px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 3px; }
  .sector-summary-cell .ss-val { font-size: 17px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--text); }

  .sector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .sector-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .sector-card-header { padding: 12px 16px 10px; border-bottom: 1px solid var(--border); }
  .sector-card-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sector-card-name { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .sector-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sector-card-pct { font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .sector-bar-wrap { margin-top: 6px; }
  .sector-bar-bg { background: var(--bg4); border-radius: 4px; height: 4px; overflow: hidden; }
  .sector-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

  /* 섹터별 메모 */
  .sector-card-memo { padding: 10px 16px; border-bottom: 1px solid var(--border); min-height: 48px; cursor: pointer; position: relative; }
  .sector-card-memo:hover { background: var(--bg3); }
  .sector-memo-text { font-size: 12px; color: var(--text2); line-height: 1.7; white-space: pre-wrap; }
  .sector-memo-text:empty::before { content: '섹터 분석, 전략, 메모... (클릭해서 편집)'; color: var(--text3); font-size: 11px; font-style: italic; }
  .sector-memo-edit-area { width: 100%; background: var(--bg3); border: 1px solid var(--accent2); border-radius: var(--radius); color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 12px; padding: 8px 10px; outline: none; resize: none; height: 80px; line-height: 1.7; display: none; }
  .sector-memo-save { position: absolute; bottom: 8px; right: 10px; font-size: 10px; padding: 3px 10px; border-radius: 4px; border: none; background: var(--accent); color: #fff; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; display: none; }

  .sector-stock-list { padding: 6px 0; }
  .sector-stock-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 16px; font-size: 12px; }
  .sector-stock-row:hover { background: var(--bg3); }
  .sector-stock-name { font-weight: 500; color: var(--text); }
  .sector-stock-right { display: flex; gap: 12px; align-items: center; }
  .sector-stock-qty { color: var(--text3); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .sector-stock-amt { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; }
  .sector-card-total { padding: 8px 16px; background: var(--bg3); border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
  .sector-card-total span:last-child { color: var(--accent); font-weight: 600; font-size: 12px; }

  .chart-section { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 20px; }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 16px; }
  .chart-bars { display: flex; flex-direction: column; gap: 10px; }
  .chart-bar-row { display: flex; align-items: center; gap: 10px; }
  .chart-bar-label { font-size: 12px; color: var(--text2); width: 70px; text-align: right; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart-bar-track { flex: 1; background: var(--bg4); border-radius: 4px; height: 24px; overflow: hidden; position: relative; }
  .chart-bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 10px; transition: width 0.5s ease; min-width: 2px; }
  .chart-bar-val { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #fff; font-weight: 500; white-space: nowrap; }
  .chart-bar-val.outside { position: absolute; left: calc(100% + 8px); color: var(--text3); top: 50%; transform: translateY(-50%); }
  .month-group { margin-bottom: 28px; }
  .month-heading { font-size: 13px; font-weight: 600; color: var(--text); padding: 10px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg) var(--radius-lg) 0 0; display: flex; align-items: center; justify-content: space-between; border-bottom: none; }
  .month-heading-left { display: flex; align-items: center; gap: 10px; }
  .month-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); overflow: hidden; margin-bottom: 10px; }
  .month-stat { background: var(--bg2); padding: 10px 14px; }
  .month-stat .ms-label { font-size: 10px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 3px; }
  .month-stat .ms-val { font-size: 16px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--text); letter-spacing: -0.02em; }
  .ms-val.pos { color: var(--green); }
  .ms-val.neg { color: var(--red); }
  .month-stat { background: var(--bg3); padding: 10px 14px; }
  .month-stat .ms-label { font-size: 10px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 3px; }
  .month-stat .ms-val { font-size: 16px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--text); letter-spacing: -0.02em; }
  .ms-val.pos { color: var(--green); }
  .ms-val.neg { color: var(--red); }
  .month-trades { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 6px; }
  .month-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  .month-table th { text-align: center; padding: 7px 14px; color: var(--text3); font-weight: 500; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--bg3); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); overflow: hidden; }
  .month-table th:last-child { border-right: none; }
  .month-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .month-table td:last-child { border-right: none; }
  .month-table tr:last-child td { border-bottom: none; }
  .month-table tr:hover td { background: var(--bg3); }
  /* stats 4칸 각 25% 에 맞춤 */
  /* 매수25%: 날짜8 구분8 종목9 = 25% */
  /* 매도25%: 섹터25% */
  /* 실현손익25%: 수량12 단가13 = 25% */
  /* 종목수25%: 금액13 실현손익12 = 25% */
  .month-table col.col-date   { width: 8%; }
  .month-table col.col-type   { width: 8%; }
  .month-table col.col-stock  { width: 9%; }
  .month-table col.col-sector { width: 25%; }
  .month-table col.col-qty    { width: 12%; }
  .month-table col.col-price  { width: 13%; }
  .month-table col.col-amt    { width: 13%; }
  .month-table col.col-profit { width: 12%; }
  .mtr-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); white-space: nowrap; }
  .mtr-stock { font-weight: 600; color: var(--text); font-size: 13px; }
  .mtr-detail { color: var(--text3); font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: right; }
  .mtr-amt { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text2); text-align: right; }
  .mtr-profit { font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: right; }
  .mtr-profit.pos { color: var(--green); }
  .mtr-profit.neg { color: var(--red); }
  .month-toggle { font-size: 11px; color: var(--text3); background: var(--bg4); border: 1px solid var(--border2); border-radius: 4px; padding: 3px 10px; cursor: pointer; transition: all 0.15s; }
  .month-toggle:hover { color: var(--text); }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* Edit modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); width: 460px; max-width: 95vw; padding: 24px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-title { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
  .modal-close { background: transparent; border: none; color: var(--text3); font-size: 20px; cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1; }
  .modal-close:hover { color: var(--text); background: var(--bg4); }
  .modal-field { margin-bottom: 12px; }
  .modal-field label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .modal-field input, .modal-field textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; padding: 7px 10px; outline: none; transition: border-color 0.15s; }
  .modal-field input[type="number"] { font-family: 'JetBrains Mono', monospace; }
  .modal-field input:focus, .modal-field textarea:focus { border-color: var(--accent2); }
  .modal-field textarea { resize: none; height: 58px; line-height: 1.5; }
  .modal-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal-mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .modal-mood-btn { padding: 6px 2px; border: 1px solid var(--border2); border-radius: var(--radius); background: transparent; cursor: pointer; font-size: 18px; text-align: center; transition: all 0.15s; }
  .modal-mood-btn:hover { border-color: var(--text3); transform: scale(1.08); }
  .modal-mood-btn.active { border-color: var(--accent); background: rgba(200,169,110,0.12); }
  .modal-mood-btn .mood-label { display: block; font-size: 9px; color: var(--text3); margin-top: 2px; font-family: 'Noto Sans KR', sans-serif; }
  .modal-mood-btn.active .mood-label { color: var(--accent); }
  .modal-type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px; }
  .modal-footer { display: flex; gap: 8px; margin-top: 20px; }
  .modal-save { flex: 1; padding: 10px; background: var(--accent); border: none; border-radius: var(--radius); color: #ffffff; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .modal-save:hover { background: var(--accent2); }
  .modal-cancel { padding: 10px 18px; background: transparent; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .modal-cancel:hover { border-color: var(--text3); color: var(--text); }
  .edit-btn { background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px; transition: all 0.15s; opacity: 0; }
  .trade-card:hover .edit-btn { opacity: 1; }
  .edit-btn:hover { color: var(--accent); background: rgba(200,169,110,0.1); }
</style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">📈</div>
        <h1>주식 매매일지</h1>
      </div>
      <div class="logo-sub">stock trading journal v2.0</div>
    </div>

    <div class="form-section">

      <!-- 구글 시트 연동 -->
      <div id="sheets-prompt" style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:14px;margin-bottom:16px;">
        <div style="font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;">🔗 Google Sheets 연동</div>
        <p style="font-size:11px;color:var(--text3);margin-bottom:8px;line-height:1.6;">Apps Script 배포 URL을 입력하면 구글 시트와 자동 동기화됩니다.</p>
        <div style="display:flex;gap:6px;">
          <input id="sheets-url-input" type="text" placeholder="https://script.google.com/macros/s/..." style="flex:1;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;padding:6px 8px;outline:none;" />
          <button onclick="saveSheetUrl()" style="padding:6px 12px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;">저장</button>
        </div>
        <div id="sheets-status" style="font-size:11px;margin-top:5px;color:var(--text3);"></div>
      </div>

      <!-- 연동 완료 상태바 (URL 등록 후 표시) -->
      <div id="sheets-connected" style="display:none;background:#eaf5ee;border:1px solid var(--green);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:11px;color:var(--green-text);font-weight:600;">✓ Google Sheets 연동 중</span>
          <div style="display:flex;gap:6px;">
            <button onclick="syncFromSheets()" style="font-size:10px;padding:3px 8px;background:var(--green-bg);border:1px solid var(--green);border-radius:3px;color:var(--green-text);cursor:pointer;font-family:'Noto Sans KR',sans-serif;">↓ 불러오기</button>
            <button onclick="syncToSheets()" style="font-size:10px;padding:3px 8px;background:var(--green-bg);border:1px solid var(--green);border-radius:3px;color:var(--green-text);cursor:pointer;font-family:'Noto Sans KR',sans-serif;">↑ 올리기</button>
            <button onclick="disconnectSheets()" style="font-size:10px;padding:3px 8px;background:transparent;border:1px solid var(--border2);border-radius:3px;color:var(--text3);cursor:pointer;font-family:'Noto Sans KR',sans-serif;">연결 해제</button>
          </div>
        </div>
        <div id="sync-status" style="font-size:10px;color:var(--text3);margin-top:4px;"></div>
      </div>

      <div class="section-label">매매 입력</div>

      <!-- 일반/단타원클릭 모드 전환 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:12px;">
        <button id="mode-normal" onclick="setInputMode('normal')" style="padding:7px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">일반 입력</button>
        <button id="mode-daytrading" onclick="setInputMode('daytrading')" style="padding:7px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">⚡ 단타 원클릭</button>
      </div>

      <!-- 단타 원클릭 폼 -->
      <div id="daytrading-form" style="display:none;">
        <div class="field">
          <label>날짜</label>
          <input type="date" id="dt-date" />
        </div>
        <div class="field-row">
          <div class="field">
            <label>종목명</label>
            <input type="text" id="dt-stock" placeholder="삼성전자" autocomplete="off" oninput="autoFillDtSector()" />
          </div>
          <div class="field">
            <label>섹터</label>
            <input type="text" id="dt-sector" placeholder="반도체" autocomplete="off" list="sector-list" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>수량 (주)</label>
            <input type="number" id="dt-qty" placeholder="10" min="1" />
          </div>
          <div class="field">
            <label>매수단가 (원)</label>
            <input type="number" id="dt-buy-price" placeholder="74000" oninput="calcDtProfit()" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>매도단가 (원)</label>
            <input type="number" id="dt-sell-price" placeholder="75000" oninput="calcDtProfit()" />
          </div>
          <div class="field">
            <label>실현손익</label>
            <div id="dt-profit-display" style="padding:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--text3);min-height:38px;display:flex;align-items:center;">—</div>
          </div>
        </div>
        <div class="field">
          <label>매매 근거 (선택)</label>
          <textarea id="dt-reason" placeholder="지지선 반등, 장대양봉 눌림목..." style="height:56px;"></textarea>
        </div>
        <div class="field">
          <label>매매 심리</label>
          <div class="mood-grid" id="dt-mood-grid">
            <button class="mood-btn" data-mood="fear" onclick="setDtMood('fear')">😨<span class="mood-label">공포</span></button>
            <button class="mood-btn" data-mood="anxiety" onclick="setDtMood('anxiety')">😟<span class="mood-label">불안</span></button>
            <button class="mood-btn active" data-mood="neutral" onclick="setDtMood('neutral')">😐<span class="mood-label">중립</span></button>
            <button class="mood-btn" data-mood="confident" onclick="setDtMood('confident')">🤭<span class="mood-label">확신</span></button>
            <button class="mood-btn" data-mood="greed" onclick="setDtMood('greed')">🤑<span class="mood-label">과욕</span></button>
          </div>
        </div>
        <button class="submit-btn" onclick="addDayTrade()" style="background:var(--accent2);">⚡ 단타 기록 추가</button>
      </div>

      <!-- 일반 입력 폼 -->
      <div id="normal-form">

      <!-- Buy / Sell / Watch -->
      <div class="type-toggle" style="grid-template-columns:1fr 1fr 1fr;">
        <button class="type-btn buy active" id="btn-buy" onclick="setType('buy')">▲ 매수</button>
        <button class="type-btn sell" id="btn-sell" onclick="setType('sell')">▼ 매도</button>
        <button class="type-btn watch" id="btn-watch" onclick="setType('watch')">◎ 관망</button>
      </div>

      <div class="field">
        <label>날짜</label>
        <input type="date" id="f-date" />
      </div>

      <div class="field-row" id="trade-stock-sector">
        <div class="field">
          <label>종목명</label>
          <input type="text" id="f-stock" placeholder="삼성전자" autocomplete="off" oninput="autoFillSector()" />
        </div>
        <div class="field">
          <label>섹터</label>
          <input type="text" id="f-sector" placeholder="반도체" autocomplete="off" list="sector-list" />
          <datalist id="sector-list">
            <option value="반도체">
            <option value="우주">
            <option value="원전">
            <option value="전력">
            <option value="로봇">
            <option value="ESS(2차전지)">
            <option value="바이오">
            <option value="금융">
            <option value="IT">
            <option value="소비재">
            <option value="에너지">
            <option value="화학">
            <option value="철강">
            <option value="게임">
            <option value="엔터">
            <option value="자동차">
            <option value="건설">
            <option value="통신">
            <option value="방산">
            <option value="조선">
            <option value="기타">
          </datalist>
        </div>
      </div>

      <div class="field-row" id="trade-qty-price">
        <div class="field">
          <label>수량 (주)</label>
          <input type="number" id="f-qty" placeholder="10" min="1" />
        </div>
        <div class="field">
          <label>단가 (원)</label>
          <input type="number" id="f-price" placeholder="74000" min="0" />
        </div>
      </div>

      <div class="field-row" id="trade-type-stoploss">
        <div class="field">
          <label>매매 유형</label>
          <select id="f-trade-type">
            <option value="">선택</option>
            <option value="단타">⚡ 단타</option>
            <option value="스윙">📈 스윙</option>
            <option value="분할매수">🪜 분할매수</option>
            <option value="장기">🏦 장기</option>
          </select>
        </div>
        <div class="field">
          <label>손절선 (%)</label>
          <input type="number" id="f-stoploss" placeholder="예: 3" min="0" max="30" step="0.5" style="font-family:'JetBrains Mono',monospace;" />
        </div>
      </div>

      <div class="field">
        <label>매매 근거</label>
        <textarea id="f-reason" placeholder="눌림목 추가매수, 실적 기대, 지지선 확인..."></textarea>
      </div>

      <div class="field">
        <label>매매 심리</label>
        <div class="mood-grid">
          <button class="mood-btn" data-mood="fear" onclick="setMood('fear')" title="공포">
            😨<span class="mood-label">공포</span>
          </button>
          <button class="mood-btn" data-mood="anxiety" onclick="setMood('anxiety')" title="불안">
            😟<span class="mood-label">불안</span>
          </button>
          <button class="mood-btn active" data-mood="neutral" onclick="setMood('neutral')" title="중립">
            😐<span class="mood-label">중립</span>
          </button>
          <button class="mood-btn" data-mood="confident" onclick="setMood('confident')" title="확신">
            🤭<span class="mood-label">확신</span>
          </button>
          <button class="mood-btn" data-mood="greed" onclick="setMood('greed')" title="과욕">
            🤑<span class="mood-label">과욕</span>
          </button>
        </div>
        <input type="text" id="f-mood-note" placeholder="심리 상태를 직접 적어보세요 (예: 손절 후 자신감 회복)" style="margin-top: 7px;" />
      </div>

      <button class="submit-btn" onclick="addTrade()">기록 추가</button>

      </div><!-- /normal-form -->

      <!-- 오늘의 심리 토글 -->
      <div class="divider" style="margin:16px 0 12px;"></div>
      <button onclick="toggleDailyMoodPanel()" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--text2);transition:all 0.15s;">
        <span>✍️ 오늘의 심리 기록</span>
        <span id="dm-toggle-icon" style="font-size:10px;">▼</span>
      </button>

      <div id="dm-panel" style="display:none;margin-top:10px;">
        <div class="field">
          <label>날짜</label>
          <input type="date" id="dm-date" />
        </div>
        <div class="field">
          <label>심리 상태</label>
          <div class="mood-grid" id="dm-mood-grid">
            <button class="mood-btn" data-mood="fear" onclick="setDailyMood('fear')">😨<span class="mood-label">공포</span></button>
            <button class="mood-btn" data-mood="anxiety" onclick="setDailyMood('anxiety')">😟<span class="mood-label">불안</span></button>
            <button class="mood-btn active" data-mood="neutral" onclick="setDailyMood('neutral')">😐<span class="mood-label">중립</span></button>
            <button class="mood-btn" data-mood="confident" onclick="setDailyMood('confident')">🤭<span class="mood-label">확신</span></button>
            <button class="mood-btn" data-mood="greed" onclick="setDailyMood('greed')">🤑<span class="mood-label">과욕</span></button>
          </div>
        </div>
        <div class="field">
          <label>한줄 요약</label>
          <input type="text" id="dm-summary" placeholder="오늘 심리 한 줄로 (예: 급등에 흔들려 충동매수)" />
        </div>
        <div class="field">
          <label>상세 메모</label>
          <textarea id="dm-note" placeholder="시장 분위기, 감정 상태, 반성이나 다짐 등..." style="height:72px;"></textarea>
        </div>
        <button class="submit-btn" style="background:var(--bg3);color:var(--text2);border:1px solid var(--border2);" onclick="addDailyMood()">기록</button>
      </div>

      <!-- 백업/복원 -->
      <div class="divider" style="margin:16px 0 12px;"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
        <button onclick="exportData()" style="padding:8px 6px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:4px;">
          💾 백업 내보내기
        </button>
        <label style="padding:8px 6px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:4px;text-align:center;">
          📂 백업 불러오기
          <input type="file" accept=".json" onchange="importData(event)" style="display:none;" />
        </label>
      </div>
      <div id="backup-status" style="font-size:11px;color:var(--text3);margin-top:6px;text-align:center;min-height:16px;"></div>

    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="tabs-bar">
      <button class="tab active" onclick="switchTab('daily')">일별 기록</button>
      <button class="tab" onclick="switchTab('monthly')">월별 요약</button>
      <button class="tab" onclick="switchTab('stock')">종목별 포지션</button>
      <button class="tab" onclick="switchTab('sector')">섹터</button>
    </div>

    <div class="stats-bar">
      <div class="stat-cell"><div class="s-label">총 거래</div><div class="s-val" id="stat-total">0</div></div>
      <div class="stat-cell"><div class="s-label">매수 / 매도</div><div class="s-val" id="stat-buysell">0 / 0</div></div>
      <div class="stat-cell"><div class="s-label">보유 종목</div><div class="s-val" id="stat-stocks">0</div></div>
      <div class="stat-cell"><div class="s-label">총 매수금액</div><div class="s-val" id="stat-amount">0</div></div>
    </div>

    <div class="content">
      <div class="panel active" id="panel-daily">
        <div id="daily-list"></div>
      </div>
      <div class="panel" id="panel-monthly">
        <div id="monthly-list"></div>
      </div>
      <div class="panel" id="panel-stock">
        <div id="stock-list"></div>
      </div>
      <div class="panel" id="panel-sector">
        <div id="sector-content"></div>
      </div>
    </div>
  </main>
</div>

<script>
  /* ── State ── */
  let tradeType = 'buy';
  let currentMood = 'neutral';
  let currentDailyMood = 'neutral';
  let trades = JSON.parse(localStorage.getItem('trades_v3') || '[]');
  let dailyMoods = JSON.parse(localStorage.getItem('daily_moods') || '[]');
  let apiKey = localStorage.getItem('claude_api_key') || '';
  let sectorMemos = JSON.parse(localStorage.getItem('sector_memos') || '{}');
  let sheetsUrl = localStorage.getItem('sheets_url') || '';

  const MOOD_MAP = {
    fear:      { emoji: '😨', label: '공포' },
    anxiety:   { emoji: '😟', label: '불안' },
    neutral:   { emoji: '😐', label: '중립' },
    confident: { emoji: '🤭', label: '확신' },
    greed:     { emoji: '🤑', label: '과욕' }
  };

  const SECTOR_COLORS = ['#c8a96e','#6e9ec8','#6ec896','#c86e6e','#9e6ec8','#c8b46e','#6ec8c8','#c88c6e','#8cc86e','#c86e9e','#6e8cc8','#b4c86e'];

  /* ── Init ── */
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];

  function toggleDailyMoodPanel() {
    const panel = document.getElementById('dm-panel');
    const icon  = document.getElementById('dm-toggle-icon');
    const open  = panel.style.display === 'none';
    panel.style.display = open ? 'block' : 'none';
    icon.textContent = open ? '▲' : '▼';

  // 구글 시트 → 로컬 불러오기
  async function syncFromSheets() {
    if (!sheetsUrl) return;
    setSyncStatus('⏳ 불러오는 중...');
    try {
      const res  = await fetch(sheetsUrl);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      if (!confirm(`시트에서 ${data.trades.length}건을 불러옵니다. 현재 로컬 데이터를 덮어쓸까요?`)) return;
      trades      = data.trades;
      dailyMoods  = data.dailyMoods;
      sectorMemos = data.sectorMemos;
      save();
      renderAll();
      setSyncStatus(`✓ ${trades.length}건 불러오기 완료`);
    } catch(err) {
      setSyncStatus('⚠ 오류: ' + err.message);
    }
  }

  // 로컬 → 구글 시트 올리기 (전체 덮어쓰기)
  async function syncToSheets() {
    if (!sheetsUrl) return;
    if (!confirm(`로컬 데이터 ${trades.length}건을 구글 시트에 올립니다. 시트 내용을 덮어쓸까요?`)) return;
    setSyncStatus('⏳ 올리는 중...');
    try {
      const res  = await fetch(sheetsUrl, {
        method: 'POST',
        body: JSON.stringify({ action: 'syncAll', trades, dailyMoods, sectorMemos })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      setSyncStatus(`✓ ${data.synced}건 동기화 완료`);
    } catch(err) {
      setSyncStatus('⚠ 오류: ' + err.message);
    }
  }

  function calcDtProfit() {
    const qty  = parseInt(document.getElementById('dt-qty').value) || 0;
    const buy  = parseInt(document.getElementById('dt-buy-price').value) || 0;
    const sell = parseInt(document.getElementById('dt-sell-price').value) || 0;
    const el   = document.getElementById('dt-profit-display');
    if (!qty || !buy || !sell) { el.textContent = '—'; el.style.color = 'var(--text3)'; return; }
    const profit = (sell - buy) * qty;
    const pct    = ((sell - buy) / buy * 100).toFixed(2);
    el.textContent = (profit >= 0 ? '+' : '') + profit.toLocaleString('ko-KR') + '원  (' + (profit >= 0 ? '+' : '') + pct + '%)';
    el.style.color = profit >= 0 ? 'var(--green-text)' : 'var(--red-text)';
  }

  }

  function addDayTrade() {
    const date   = document.getElementById('dt-date').value;

    renderAll();

  /* ── Format ── */
  function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
  function fmtAmt(n) {
    if (n >= 100000000) return (n / 100000000).toFixed(1) + '억';
    if (n >= 10000) return Math.round(n / 10000) + '만';
    return fmt(n);
  }

  /* ── Add Trade ── */
  function addTrade() {
    const date     = document.getElementById('f-date').value;
    const reason   = document.getElementById('f-reason').value.trim();
    const mood     = currentMood;
    const moodNote = document.getElementById('f-mood-note').value.trim();

    if (tradeType === 'watch') {
      if (!date) { alert('날짜는 필수입니다.'); return; }
      const trade = { id: Date.now(), date, stock: '', sector: '', type: 'watch', qty: 0, price: 0, reason, mood, moodNote };
      trades.push(trade);
      save();
      renderAll();
      document.getElementById('f-reason').value = '';
      document.getElementById('f-mood-note').value = '';
      setMood('neutral');
      if (reason && apiKey) callClaude(trade);
      return;
    }

    const stock  = document.getElementById('f-stock').value.trim();
    const sector = document.getElementById('f-sector').value.trim();
    const qty    = parseInt(document.getElementById('f-qty').value);
    const price  = parseInt(document.getElementById('f-price').value);

    if (!date || !stock || !qty || !price) {
      alert('날짜, 종목명, 수량, 단가는 필수입니다.');
      return;
    }

    const tradeStyle = document.getElementById('f-trade-type').value;
    const stoploss   = parseFloat(document.getElementById('f-stoploss').value) || null;
    const trade = { id: Date.now(), date, stock, sector, type: tradeType, qty, price, reason, mood, moodNote, tradeStyle, stoploss };
    trades.push(trade);
    save();
    renderAll();
    pushTradeToSheets(trade);
    document.getElementById('f-sector').value = '';
    document.getElementById('f-qty').value = '';
    document.getElementById('f-price').value = '';
    document.getElementById('f-reason').value = '';
    document.getElementById('f-mood-note').value = '';
    document.getElementById('f-trade-type').value = '';
    document.getElementById('f-stoploss').value = '';
    setMood('neutral');

    if (reason && apiKey) callClaude(trade);
  }

  /* ── Claude API ── */
  async function callClaude(trade) {
    const fb      = document.getElementById('ai-feedback');
    const spinner = document.getElementById('ai-spinner');
    const label   = document.getElementById('ai-label');
    const text    = document.getElementById('ai-text');

    fb.classList.add('visible');
    text.textContent = '';
    spinner.style.display = 'inline-block';
    label.textContent = 'Claude 분석 중';

    const stockTrades  = trades.filter(t => t.stock === trade.stock);
    const buys         = stockTrades.filter(t => t.type === 'buy');
    const sells        = stockTrades.filter(t => t.type === 'sell');
    const totalBuyQty  = buys.reduce((s, t) => s + t.qty, 0);
    const totalSellQty = sells.reduce((s, t) => s + t.qty, 0);
    const holdQty      = totalBuyQty - totalSellQty;
    const avgPrice     = totalBuyQty > 0 ? Math.round(buys.reduce((s, t) => s + t.price * t.qty, 0) / totalBuyQty) : 0;
    const moodInfo     = MOOD_MAP[trade.mood] || MOOD_MAP.neutral;

    const prompt = `주식 매매일지 기록입니다. 이 매매에 대해 간결하고 솔직한 피드백을 부탁드립니다.

[이번 매매]
- 종목: ${trade.stock}${trade.sector ? ' (' + trade.sector + ' 섹터)' : ''}
- 유형: ${trade.type === 'buy' ? '매수' : '매도'}
- 매매 유형: ${trade.tradeStyle || '미입력'}
- 손절선: ${trade.stoploss ? trade.stoploss + '%' : '미설정 ⚠️'}
- 수량: ${trade.qty}주 @ ${fmt(trade.price)}원
- 매매 근거: ${trade.reason}
- 매매 당시 심리: ${moodInfo.emoji} ${moodInfo.label}${trade.moodNote ? ' — ' + trade.moodNote : ''}

[현재 포지션]
- 보유 수량: ${holdQty}주
- 평균 매수단가: ${fmt(avgPrice)}원
- 이 종목 총 거래 횟수: ${stockTrades.length}회

피드백 기준:
1. 매매 근거의 논리성
2. 심리 상태가 판단에 미치는 영향 (특히 공포/과욕 시 주의점)
3. 손절선 설정 여부 및 리스크 관리 (미설정 시 반드시 언급)
4. 매매 유형과 실제 전략의 일관성

2~3문장, 한국어, 솔직하고 실용적으로 답해주세요.`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 350, messages: [{ role: 'user', content: prompt }] })
      });
      const data = await res.json();
      spinner.style.display = 'none';
      label.textContent = 'Claude 피드백';
      text.textContent = data.content?.[0]?.text || '응답을 가져올 수 없습니다.';
    } catch (e) {
      spinner.style.display = 'none';
      label.textContent = 'Claude 피드백';
      text.textContent = 'API 호출 오류. API 키를 확인해주세요.';
    }
  }

  function saveEdit() {
    if (!editingId) return;
    const idx = trades.findIndex(x => x.id === editingId);
    if (idx === -1) return;
    const date     = document.getElementById('m-date').value;
    const stock    = document.getElementById('m-stock').value.trim();
    const sector   = document.getElementById('m-sector').value.trim();
    const qty      = parseInt(document.getElementById('m-qty').value);
    const price    = parseInt(document.getElementById('m-price').value);
    const reason   = document.getElementById('m-reason').value.trim();
    const moodNote = document.getElementById('m-mood-note').value.trim();
    if (!date || !stock || !qty || !price) { alert('날짜, 종목명, 수량, 단가는 필수입니다.'); return; }
    trades[idx] = { ...trades[idx], date, stock, sector, type: document._modalType || trades[idx].type, qty, price, reason, mood: modalMood, moodNote };
    save();
    renderAll();

  function save() {
    localStorage.setItem('trades_v3', JSON.stringify(trades));
